<!doctype html><html><head><meta charset="utf-8"><title>Squid duo</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:15px/1.4 system-ui,sans-serif;color:#fff}
#status{position:fixed;top:12px;right:12px;background:#0009;padding:6px 10px;border-radius:8px}
#shot{position:fixed;top:12px;left:12px;background:#0009;padding:6px 10px;border-radius:8px;font:12px ui-monospace,monospace}
#subs{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);width:min(860px,90vw);text-align:center}
#subs div{background:#000b;display:inline-block;padding:6px 12px;border-radius:8px}
#subs .Squidward{color:#c9f0c4} #subs .SpongeBob{color:#ffe873} #subs .narrator{color:#ddd;font-style:italic}
#go{position:fixed;inset:0;display:grid;place-items:center;background:#000a;font-size:22px;cursor:pointer}
#fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity .45s;pointer-events:none}
#story{position:fixed;top:52px;left:50%;transform:translateX(-50%);width:min(720px,90vw);color:#fff;font:14px system-ui,sans-serif;text-shadow:0 1px 3px #000}
#story .bar{height:4px;background:#ffffff33;border-radius:2px;margin-top:6px;overflow:hidden}
#story .bar i{display:block;height:100%;width:0;background:#f5d742;transition:width .8s}
#story .tick{white-space:nowrap;overflow:hidden}#story .tick span{display:inline-block;padding-left:100%;animation:tick 22s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
#free{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#f5d742;color:#000;border:0;border-radius:8px;padding:7px 14px;font:bold 14px system-ui,sans-serif;cursor:pointer}
#free.on{background:#0009;color:#f5d742;cursor:default}
#hint{position:fixed;left:12px;bottom:12px;background:#0009;padding:4px 8px;border-radius:6px;font:12px ui-monospace,monospace;color:#f5d742}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<div id="status">загрузка…</div><div id="shot"></div><div id="subs"></div><div id="hint">[F] — дверь</div><div id="story" hidden><div class="tick"><span></span></div><div class="bar"><i></i></div></div><button id="free" hidden>⚡ Фристайл [G]</button><div id="fade"></div><div id="go">▶ клик — смотреть сцену</div>
<script type="module">
// Squid duo (test-only, SpongeBob never ships): no player. The h0/dream engine (duo.py) plays SpongeBob and
// Squidward with its director and Fish voices; this page stages its live lines in the H16 room: Squidward is
// the anymove rig, SpongeBob is built from code boxes (image models refuse to draw him), and a camera
// director cuts between shots on every line.  ?dream=<port> of the engine viewer (default 8771).
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), n = (k, v) => +(q.get(k) ?? v);
const DREAM = `http://127.0.0.1:${n('dream', 8771)}`;
const [R, H, SQ_H] = [4.2, 3.6, 1.85];
const $ = (id) => document.getElementById(id), status = (t) => { $('status').textContent = t; };

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

// ---- room: same build as index.html / h0/out/h16/round.html ----
const load = (f) => new Promise((ok) => new THREE.TextureLoader().load('/room/' + f + '.png', (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; ok(t); }));
const T = Object.fromEntries(await Promise.all(['t_wall', 't_floor', 't_ceiling', 't_beam', 'd_door', 'd_portrait', 'd_window'].map(async (f) => [f, await load(f)])));
const tiled = (t, rx, ry, side = THREE.FrontSide) => { t = t.clone(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.needsUpdate = true;
  return new THREE.MeshLambertMaterial({map: t, side}); };
const add = (geo, mat, pos = [0, 0, 0], rot = [0, 0, 0], parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot); parent.add(m); return m; };
add(new THREE.CylinderGeometry(R, R, H, 96, 1, true), tiled(T.t_wall, 2 * Math.PI * R / 2, H / 2, THREE.BackSide), [0, H / 2, 0]);
add(new THREE.CircleGeometry(R, 96), tiled(T.t_floor, R, R), [0, 0, 0], [-Math.PI / 2, 0, 0]).receiveShadow = true;
add(new THREE.CircleGeometry(R, 96), tiled(T.t_ceiling, R / 1.5, R / 1.5), [0, H, 0], [Math.PI / 2, 0, 0]);
for (const a of [0, 60, 120]) add(new THREE.BoxGeometry(0.22, 0.3, 2 * R), tiled(T.t_beam, 1, 4), [0, H - 0.15, 0], [0, a * Math.PI / 180, 0]);
const decal = (t, w, h, th, y) => { const a = th * Math.PI / 180, d = Math.sqrt(R * R - (w / 2) ** 2) - 0.02;
  add(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({map: t, transparent: true, alphaTest: 0.5}), [d * Math.sin(a), y, -d * Math.cos(a)], [0, -a, 0]); };
decal(T.d_window, 2.8, 1.4, 15, 1.9); decal(T.d_portrait, 1.1, 1.1, -58, 2.1); decal(T.d_portrait, 1.0, 1.0, -38, 2.05);
decal(T.d_door, 0.95, 2.3, 75, 1.15); decal(T.d_door, 0.95, 2.3, -110, 1.15);
const blobTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,0.85)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const blob = (x, z, w) => { const m = add(new THREE.PlaneGeometry(w, w), new THREE.MeshBasicMaterial({map: blobTex, transparent: true, depthWrite: false}), [x, 0.004, z], [-Math.PI / 2, 0, 0]); m.renderOrder = 1; return m; };
const polar = (th, r) => [r * Math.sin(th * Math.PI / 180), -r * Math.cos(th * Math.PI / 180)];
const PROPS = [
  {file: 'p_sofa', height: 1.0, at: polar(45, 3.1), face: 'c'}, {file: 'p_armchair', height: 1.35, at: polar(95, 3.0), face: 'c'},
  {file: 'p_table', height: 0.85, at: [-1.3, 0.9], yaw: 0},
  ...[[0.9, 0], [-0.9, 0], [0, 0.9], [0, -0.9]].map(([dx, dz]) => ({file: 'p_chair', height: 1.5, at: [-1.3 + dx, 0.9 + dz], face: [-1.3, 0.9]})),
  {file: 'p_easel', height: 1.75, at: polar(160, 3.0), face: 'c'}, {file: 'p_vase', height: 0.75, at: polar(-80, 3.7), face: 'c'},
  {file: 'p_coral', height: 0.9, at: polar(-140, 3.5), face: 'c'}, {file: 'p_stand', height: 1.1, at: polar(-20, 2.9), face: 'c'},
  {file: 'p_lamp', height: 0.7, at: [0, 0], yaw: 0, top: H},
];
const gltf = new GLTFLoader(), yo = n('yo', 30);
await Promise.all(PROPS.map(async (p) => {
  const g = (await gltf.loadAsync('/room/' + p.file + '.glb').catch(() => null))?.scene;
  if (!g) return;
  const holder = new THREE.Group(); holder.add(g);
  let b = new THREE.Box3().setFromObject(holder);
  holder.scale.setScalar(p.height / b.getSize(new THREE.Vector3()).y);
  b = new THREE.Box3().setFromObject(holder); const c = b.getCenter(new THREE.Vector3());
  g.position.sub(new THREE.Vector3(c.x, b.min.y, c.z).divideScalar(holder.scale.x));
  const [x, z] = p.at, tgt = p.face === 'c' ? [0, 0] : p.face;
  const yaw = tgt ? Math.atan2(tgt[0] - x, tgt[1] - z) * 180 / Math.PI : p.yaw;
  holder.position.set(x, p.top ? p.top - p.height : 0, z); holder.rotation.y = (yaw + yo) * Math.PI / 180;
  scene.add(holder);
  if (!p.top) { g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    const s = b.getSize(new THREE.Vector3()); blob(x, z, Math.max(s.x, s.z) * 1.4); }
}));
scene.add(new THREE.HemisphereLight(0xfff6e0, 0x553344, 2.2));
const lamp = new THREE.PointLight(0xffe2c0, 8, 0, 1.2); lamp.position.set(0, H - 0.9, 0); scene.add(lamp);
const spot = new THREE.SpotLight(0xffe8c8, 22, 0, 1.25, 1, 1.4); spot.position.set(0, H - 0.95, 0); spot.target.position.set(0, 0, 0);
const fill = new THREE.PointLight(0xfff0e0, 1.6, 6, 1); cam.add(fill); scene.add(cam);  // soft fill from the lens
spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.radius = 6; spot.shadow.bias = -0.0005; scene.add(spot, spot.target);

// ---- Squidward: one rig, every clip from its own capture GLB (as in index.html) ----
status('загружаю Сквидварда…');
const CLIPS = {idle: 'idle_s1', talk: 'talk_s1', walk: 'walk_proc', wave: 'wave_s1', shrug: 'shrug_s1', facepalm: 'facepalm_s1',
  armscross: 'armscross_s1', react: 'react_s1', clarinet: 'clarinet_s1', doze: 'doze_s1', flee: 'mb_walk_scared'};
const glbs = Object.fromEntries(await Promise.all(Object.entries(CLIPS).map(async ([k, f]) =>
  [k, await gltf.loadAsync(`/clips/${f}/render/animation.glb`).catch(() => null)])));
const sqRoot = new THREE.Group(), body = glbs.idle.scene; sqRoot.add(body); scene.add(sqRoot);
body.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false;
  for (const m of [o.material].flat()) { if ('metalness' in m) { m.metalness = 0; m.roughness = Math.max(m.roughness, 0.7); } } } });
{ body.updateMatrixWorld(true); let b = new THREE.Box3().setFromObject(body);
  body.scale.setScalar(SQ_H / b.getSize(new THREE.Vector3()).y); body.updateMatrixWorld(true);
  b = new THREE.Box3().setFromObject(body); const c = b.getCenter(new THREE.Vector3());
  body.position.set(-c.x, -b.min.y, -c.z); }
const mixer = new THREE.AnimationMixer(body), acts = {};
for (const [k, g] of Object.entries(glbs)) {
  if (!g?.animations[0]) continue;
  const clip = g.animations[0].clone(); clip.name = k;
  for (const t of clip.tracks) if (t.name.endsWith('.position') && /pelvis|root|hips/i.test(t.name)) {
    const v = t.values, [x0, z0] = [v[0], v[2]]; for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 2] = z0; } }
  acts[k] = mixer.clipAction(clip);
}
const bone = {}; body.traverse((o) => { if (o.isBone || o.type === 'Bone' || /_[LR]$|head/.test(o.name)) bone[o.name] ??= o; });
const brush = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.28, 6), new THREE.MeshLambertMaterial({color: 0x9a6a3a}));
const tip = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), new THREE.MeshLambertMaterial({color: 0xd04a6a})); tip.position.y = 0.15; brush.add(tip);
bone.hand_R?.add(brush); brush.scale.setScalar(1 / body.scale.x); brush.visible = false;
let cur = null;
const play = (k, {once = false, fade = 0.35} = {}) => {
  const a = acts[k] ?? acts.idle; if (a === cur) return a;
  a.reset(); a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity); a.clampWhenFinished = once; a.play();
  if (cur) cur.crossFadeTo(a, fade, false); cur = a; return a; };
play('idle');

// ---- SpongeBob from code: a holey yellow box with a painted face, clothes as slabs, limbs on pivots ----
const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const holes = (g, w, h, seed) => { let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  g.fillStyle = '#f6e04a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) { const r = 6 + rnd() * 16; g.fillStyle = rnd() < 0.6 ? '#cdb52c' : '#e2c93a';
    g.beginPath(); g.ellipse(rnd() * w, rnd() * h, r, r * (0.7 + rnd() * 0.5), 0, 0, 7); g.fill(); } };
const face = canvasTex(512, 420, (g, w, h) => { holes(g, w, h, 7);
  for (const x of [176, 336]) {  // eyes, lashes, iris, pupil
    g.lineWidth = 6; g.strokeStyle = '#222';
    for (const dx of [-30, 0, 30]) { g.beginPath(); g.moveTo(x + dx, 78); g.lineTo(x + dx * 1.4, 40); g.stroke(); }
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, 150, 72, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#4aa8e8'; g.beginPath(); g.arc(x + 6, 154, 32, 0, 7); g.fill(); g.lineWidth = 3; g.stroke();
    g.fillStyle = '#111'; g.beginPath(); g.arc(x + 6, 154, 14, 0, 7); g.fill(); }
  g.fillStyle = '#e8cc3a'; g.beginPath(); g.ellipse(256, 236, 22, 30, 0, 0, 7); g.fill();  // nose
  g.fillStyle = '#f08a8a'; for (const x of [100, 412]) { g.beginPath(); g.arc(x, 270, 30, 0, 7); g.fill(); }  // cheeks
  g.fillStyle = '#c0605a'; for (const [x, y] of [[90, 262], [104, 276], [112, 258], [400, 262], [414, 276], [422, 258]]) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
  g.lineWidth = 7; g.strokeStyle = '#3a2410'; g.beginPath(); g.moveTo(130, 268); g.quadraticCurveTo(256, 360, 382, 268); g.stroke();  // smile
  g.fillStyle = '#fff'; g.strokeStyle = '#222'; g.lineWidth = 3; for (const x of [226, 260]) { g.fillRect(x, 304, 28, 30); g.strokeRect(x, 304, 28, 30); } });
const side = canvasTex(256, 256, (g, w, h) => holes(g, w, h, 3));
const M = (c) => new THREE.MeshLambertMaterial({color: c}), sideM = new THREE.MeshLambertMaterial({map: side});
const sb = new THREE.Group(), sbBody = new THREE.Group(); sb.add(sbBody); scene.add(sb);
add(new THREE.BoxGeometry(0.62, 0.5, 0.2), [sideM, sideM, sideM, sideM, new THREE.MeshLambertMaterial({map: face}), sideM], [0, 0.77, 0], [0, 0, 0], sbBody);
add(new THREE.BoxGeometry(0.6, 0.075, 0.19), M(0xffffff), [0, 0.485, 0], [0, 0, 0], sbBody);  // shirt
add(new THREE.BoxGeometry(0.6, 0.13, 0.19), M(0x8a5a2b), [0, 0.385, 0], [0, 0, 0], sbBody);  // shorts
add(new THREE.BoxGeometry(0.605, 0.025, 0.195), M(0x111111), [0, 0.435, 0], [0, 0, 0], sbBody);  // belt
add(new THREE.BoxGeometry(0.05, 0.12, 0.02), M(0xd8262c), [0, 0.47, 0.1], [0, 0, 0], sbBody);  // tie
for (const s of [-1, 1]) add(new THREE.ConeGeometry(0.05, 0.06, 3), M(0xffffff), [s * 0.05, 0.525, 0.1], [Math.PI, 0, s * 0.4], sbBody);  // collar
const mouth = add(new THREE.CircleGeometry(0.06, 20), M(0x5a1010), [0, 0.72, 0.101], [0, 0, 0], sbBody); mouth.scale.set(1.4, 0.01, 1);
const limb = (x, y, kind) => { const p = new THREE.Group(); p.position.set(x, y, 0); sbBody.add(p);
  if (kind === 'arm') { add(new THREE.CylinderGeometry(0.05, 0.05, 0.07, 10), M(0xffffff), [0, -0.03, 0], [0, 0, 0], p);
    add(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8), M(0xf6e04a), [0, -0.19, 0], [0, 0, 0], p);
    add(new THREE.SphereGeometry(0.045, 12, 8), M(0xf6e04a), [0, -0.36, 0], [0, 0, 0], p); }
  else { add(new THREE.CylinderGeometry(0.024, 0.024, 0.16, 8), M(0xf6e04a), [0, -0.08, 0], [0, 0, 0], p);
    add(new THREE.CylinderGeometry(0.03, 0.03, 0.11, 10), M(0xffffff), [0, -0.2, 0], [0, 0, 0], p);
    add(new THREE.CylinderGeometry(0.031, 0.031, 0.012, 10), M(0xd8262c), [0, -0.165, 0], [0, 0, 0], p);
    add(new THREE.CylinderGeometry(0.031, 0.031, 0.012, 10), M(0x2a5ad8), [0, -0.185, 0], [0, 0, 0], p);
    add(new THREE.BoxGeometry(0.1, 0.065, 0.17), M(0x111111), [0, -0.285, 0.035], [0, 0, 0], p); }
  return p; };
const sbArm = [limb(-0.33, 0.66, 'arm'), limb(0.33, 0.66, 'arm')], sbLeg = [limb(-0.13, 0.32, 'leg'), limb(0.13, 0.32, 'leg')];
sb.traverse((o) => { if (o.isMesh) o.castShadow = true; });

// ---- the two actors: where they stand, where they are going, what they are busy with ----
const PLACES = {
  easel: {at: polar(160, 2.15), look: polar(160, 3.0), act: 'paint'}, clarinet: {at: polar(-20, 2.05), look: polar(-20, 2.9), act: 'clarinet'},
  window: {at: polar(15, 3.15), look: polar(15, 4.2), act: 'idle'}, sofa: {at: polar(45, 2.2), look: [0, 0], act: 'doze'},
  portraits: {at: polar(-48, 3.0), look: polar(-48, 4.2), act: 'idle'}, coral: {at: polar(-140, 2.9), look: polar(-140, 3.5), act: 'idle'},
  door: {at: polar(-110, 3.3), look: null, act: 'armscross'}, table: {at: [-0.2, 0.9], look: [-1.3, 0.9], act: 'idle'},
};
// engine object names (duo_scene.json) -> places
const OBJ = {easel: 'easel', clarinet: 'clarinet', sofa: 'sofa', 'porthole window': 'window', 'self-portrait': 'portraits',
  'potted coral': 'coral', 'front door': 'door', table: 'table'};
const TABLE = [-1.3, 0.9, 1.35];
const actor = (name, at, h) => ({name, pos: new THREE.Vector2(...at), yaw: 0, task: null, activity: null, h, talking: false, gesture: '', gestureUntil: 0});
let actorsOut = false;  // book mode: after the scene change both of them are out on Conch Street
const SQ = actor('Squidward', PLACES.easel.at, SQ_H), SB = actor('SpongeBob', polar(-110, 3.1), 1.02);
for (const k in PLACES) PLACES[k].key = k;
SQ.activity = PLACES.easel; SQ.yaw = Math.atan2(PLACES.easel.look[0] - SQ.pos.x, PLACES.easel.look[1] - SQ.pos.y);
const other = (a) => a === SQ ? SB : SQ;
const turnTo = (a, x, z, dt, speed = 4) => { const want = Math.atan2(x - a.pos.x, z - a.pos.y);
  const d = ((want - a.yaw + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  a.yaw += Math.sign(d) * Math.min(Math.abs(d), speed * dt); return Math.abs(d); };
const walk = (a, to, {stopAt = 0.08, speed = 0.9, place = null, then = null} = {}) => { a.task = {to, stopAt, speed, place, then}; a.activity = null; };
// one walking step toward (tx, tz), bent around the table and around the other actor
const stepTo = (a, tx, tz, speed, dt) => {
  let dx = tx - a.pos.x, dz = tz - a.pos.y; const dist = Math.hypot(dx, dz); dx /= dist; dz /= dist;
  const o = other(a);
  for (const [ox, oz, r] of [...(actorsOut ? CORALS : [TABLE]), [o.pos.x, o.pos.y, 0.7]]) {
    const ex = a.pos.x - ox, ez = a.pos.y - oz, e = Math.hypot(ex, ez), w = (r + 0.5 - e) / 0.5;
    if (w <= 0 || (ex * dx + ez * dz) > 0) continue;
    const s = Math.sign(-ez * dx + ex * dz) || 1;
    dx += (-ez / e * s + ex / e * 0.5) * Math.min(w, 1.5) * 1.6; dz += (ex / e * s + ez / e * 0.5) * Math.min(w, 1.5) * 1.6;
    const l = Math.hypot(dx, dz); dx /= l; dz /= l;
  }
  if (turnTo(a, a.pos.x + dx, a.pos.y + dz, dt, 5) < 0.8) { const st = Math.min(speed * dt, dist); a.pos.x += Math.sin(a.yaw) * st; a.pos.y += Math.cos(a.yaw) * st; }
  const rr = Math.hypot(a.pos.x, a.pos.y), max = R - 0.5; if (!actorsOut && rr > max) { a.pos.x *= max / rr; a.pos.y *= max / rr; }
};
// SpongeBob comes in through the front door and walks up to Squidward
walk(SB, () => [SQ.pos.x, SQ.pos.y], {stopAt: 1.4, speed: 1.1});

// ---- what a line looks like on the body: the engine gives words and voice directions, this picks a gesture ----
const pick = (who, text, remarks) => {
  const r = (remarks || []).join(' ').toLowerCase(), t = text.toLowerCase();
  if (/\b(hi|hello|bye|goodbye|morning)\b/.test(t) && Math.random() < 0.7) return 'wave';
  if (who === 'Squidward') {
    if (/shrill|startl|gasp|yelp|shriek|alarm/.test(r)) return 'react';
    if (/sigh|exhaust|groan|weary|tired/.test(r)) return Math.random() < 0.5 ? 'facepalm' : 'shrug';
    if (/scoff|sarcas|dry|deadpan/.test(r)) return 'shrug';
    if (/firm|sharp|stern|offend|irritat|cold|stubborn/.test(r)) return 'armscross';
    return 'none';
  }
  if (/excit|bouncy|squeal|giddy|cheer|bubbly|gasp/.test(r)) return 'jump';
  if (/sad|small|hurt|quiet|sniff|disappoint/.test(r)) return 'droop';
  return 'none';
};

// ---- camera director: a bank of shots, one cut per line, a reaction cut inside long lines ----

  if (SB.talking) { sy += Math.abs(Math.sin(t * 7)) * 0.04; armZ = [0.5 + Math.sin(t * 3.1) * 0.35, -0.5 - Math.sin(t * 3.7 + 1) * 0.35]; armX = [-0.4 - Math.sin(t * 2.3) * 0.3, -0.4 - Math.sin(t * 2.9) * 0.3]; }
