<!doctype html><html><head><meta charset="utf-8">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;display:grid;grid-template-columns:repeat(4,1fr);background:#bfe3f5;font:13px sans-serif}
div{position:relative}model-viewer{width:25vw;height:33vh}b{position:absolute;top:6px;left:8px;z-index:1}</style></head><body>
<div><b>Tripo · pineapple</b><model-viewer src="glb_tripo/pineapple_house.glb" exposure="1.1"></model-viewer></div>
<div><b>SAM3D · pineapple</b><model-viewer src="glb_sam3d/pineapple_house.glb" exposure="1.1"></model-viewer></div>
<div><b>Tripo · squidward house</b><model-viewer src="glb_tripo/squidward_house.glb" exposure="1.1"></model-viewer></div>
<div><b>SAM3D · squidward house</b><model-viewer src="glb_sam3d/squidward_house.glb" exposure="1.1"></model-viewer></div>
<div><b>P1 · house</b><model-viewer src="glb_gpt_p1/02_squidward_house.glb" exposure="1.1"></model-viewer></div>
<div><b>H3.1 · house</b><model-viewer src="glb_gpt_h31/02_squidward_house.glb" exposure="1.1"></model-viewer></div>
<div><b>SAM3D · house</b><model-viewer src="glb_sam3d/02_squidward_house.glb" exposure="1.1"></model-viewer></div>
<div><b>—</b></div>
<div><b>P1 · squidward</b><model-viewer src="glb_gpt_p1/09_squidward.glb" exposure="1.1"></model-viewer></div>
<div><b>H3.1 · squidward</b><model-viewer src="glb_gpt_h31/09_squidward.glb" exposure="1.1"></model-viewer></div>
<div><b>SAM3D · squidward</b><model-viewer src="glb_sam3d/09_squidward.glb" exposure="1.1"></model-viewer></div>
<div><b>—</b></div>
<script>const o=new URLSearchParams(location.search).get('orbit')||'20deg 80deg auto';
document.querySelectorAll('model-viewer').forEach(m=>m.setAttribute('camera-orbit',o))</script>
</body></html>
