<!doctype html><html><head><meta charset="utf-8"><title>H16 round room</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/app/node_modules/three/build/three.module.js","three/addons/":"/app/node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// Squidward's living room from reference frames (test-only): code builds the space — a round room, ceiling beams,
// where every decal and prop stands — and Muse/SAM3D only supply the surfaces and objects (out/h16/sq2).
// ?x=&z=&yaw=&pitch= camera pose for screenshots, ?walk=1 drag to look, WASD to step, R back to the centre,
// ?yo=30 front offset of SAM3D objects (three-quarter source images put the front ~30° off).
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), n = (k, v) => +(q.get(k) ?? v);
const [R, H, EYE] = [4.2, 3.6, 1.6];
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(innerWidth, innerHeight); renderer.outputColorSpace = THREE.SRGBColorSpace;
// ?fx=1 cheap grounding: ACES tone mapping, one soft shadow map from the ceiling lamp, a blurred contact blob under each prop
const FX = !!q.get('fx');
if (FX) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(90, innerWidth / innerHeight, 0.05, 100);
cam.position.set(n('x', 0), EYE, n('z', 0));
cam.rotation.order = 'YXZ'; cam.rotation.y = -n('yaw', 0) * Math.PI / 180; cam.rotation.x = n('pitch', 0) * Math.PI / 180;
const load = (f) => new Promise((ok) => new THREE.TextureLoader().load('sq2/' + f + '.png', (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; ok(t); }));
const T = Object.fromEntries(await Promise.all(['t_wall', 't_floor', 't_ceiling', 't_beam', 'd_door', 'd_portrait', 'd_window'].map(async (f) => [f, await load(f)])));
// tiled material: the texture repeats rx × ry times over the surface's own UVs
const tiled = (t, rx, ry, side = THREE.FrontSide) => { t = t.clone(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.needsUpdate = true;
  return new THREE.MeshLambertMaterial({map: t, side}); };
const add = (geo, mat, pos = [0, 0, 0], rot = [0, 0, 0]) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot); scene.add(m); return m; };

add(new THREE.CylinderGeometry(R, R, H, 96, 1, true), tiled(T.t_wall, 2 * Math.PI * R / 2, H / 2, THREE.BackSide), [0, H / 2, 0]);
add(new THREE.CircleGeometry(R, 96), tiled(T.t_floor, R, R), [0, 0, 0], [-Math.PI / 2, 0, 0]).receiveShadow = true;  // circle UVs span the diameter: 2R/2 m tiles
// contact blob: a radial dark gradient drawn once on a canvas, reused under every prop
const blobTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(0,0,0,0.85)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
add(new THREE.CircleGeometry(R, 96), tiled(T.t_ceiling, R / 1.5, R / 1.5), [0, H, 0], [Math.PI / 2, 0, 0]);
for (const a of [0, 60, 120])  // beams across the ceiling through the centre, like the frames' radiating beams
  add(new THREE.BoxGeometry(0.22, 0.3, 2 * R), tiled(T.t_beam, 1, 4), [0, H - 0.15, 0], [0, a * Math.PI / 180, 0]);

// a flat decal on the curved wall at azimuth th (0 = -z, clockwise seen from above): pulled in so its edges
// still touch the wall instead of its middle floating off it
const decal = (t, w, h, th, y) => { const a = th * Math.PI / 180, d = Math.sqrt(R * R - (w / 2) ** 2) - 0.02;
  add(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({map: t, transparent: true, alphaTest: 0.5}),
      [d * Math.sin(a), y, -d * Math.cos(a)], [0, -a, 0]); };
decal(T.d_window, 2.8, 1.4, 15, 1.9);
decal(T.d_portrait, 1.1, 1.1, -58, 2.1);
decal(T.d_portrait, 1.0, 1.0, -38, 2.05);
decal(T.d_door, 0.95, 2.3, 75, 1.15);
decal(T.d_door, 0.95, 2.3, -110, 1.15);

// props: real height in metres, a spot, and either a yaw or face:'c' (turn the front toward the room centre)
// or face:[x,z] (toward a point, e.g. the table); scaled, centred and stood on the floor by code
const polar = (th, r) => [r * Math.sin(th * Math.PI / 180), -r * Math.cos(th * Math.PI / 180)];
const PROPS = [
  {file: 'p_sofa', height: 1.0, at: polar(45, 3.1), face: 'c'},
  {file: 'p_armchair', height: 1.35, at: polar(95, 3.0), face: 'c'},
  {file: 'p_table', height: 0.85, at: [-1.3, 0.9], yaw: 0},
  ...[[0.9, 0], [-0.9, 0], [0, 0.9], [0, -0.9]].map(([dx, dz]) => ({file: 'p_chair', height: 1.5, at: [-1.3 + dx, 0.9 + dz], face: [-1.3, 0.9]})),
  {file: 'p_easel', height: 1.75, at: polar(160, 3.0), face: 'c'},
  {file: 'p_vase', height: 0.75, at: polar(-80, 3.7), face: 'c'},
  {file: 'p_coral', height: 0.9, at: polar(-140, 3.5), face: 'c'},
  {file: 'p_stand', height: 1.1, at: polar(-20, 2.9), face: 'c'},
  {file: 'p_lamp', height: 0.7, at: [0, 0], yaw: 0, top: H},  // hangs: its top touches the ceiling
];
const gltf = new GLTFLoader(), yo = n('yo', 30);
await Promise.all(PROPS.map(async (p) => {
  const g = (await gltf.loadAsync('sq2/' + p.file + '.glb').catch(() => null))?.scene;
  if (!g) return;
  const holder = new THREE.Group(); holder.add(g);
  let b = new THREE.Box3().setFromObject(holder);
  holder.scale.setScalar(p.height / b.getSize(new THREE.Vector3()).y);
  b = new THREE.Box3().setFromObject(holder); const c = b.getCenter(new THREE.Vector3());
  g.position.sub(new THREE.Vector3(c.x, b.min.y, c.z).divideScalar(holder.scale.x));
  const [x, z] = p.at, tgt = p.face === 'c' ? [0, 0] : p.face;
  // front of a SAM3D object at yaw 0 points to +z; yaw turns it toward (sin, cos)
  const yaw = tgt ? Math.atan2(tgt[0] - x, tgt[1] - z) * 180 / Math.PI : p.yaw;
  holder.position.set(x, p.top ? p.top - p.height : 0, z); holder.rotation.y = (yaw + yo) * Math.PI / 180;
  scene.add(holder);
  if (FX && !p.top) {
    g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    const s = b.getSize(new THREE.Vector3()), w = Math.max(s.x, s.z) * 1.4;  // footprint, a bit wider than the object
    const blob = add(new THREE.PlaneGeometry(w, w), new THREE.MeshBasicMaterial({map: blobTex, transparent: true, depthWrite: false}),
      [x, 0.004, z], [-Math.PI / 2, 0, 0]);
    blob.renderOrder = 1;
  }
}));

scene.add(new THREE.HemisphereLight(0xfff6e0, 0x553344, FX ? 2.0 : 2.4));
const lamp = new THREE.PointLight(0xffe2c0, 8, 0, 1.2); lamp.position.set(0, H - 0.9, 0); scene.add(lamp);
if (FX) {  // one spot straight down from the lamp: a single 1024² shadow map instead of a point light's six
  const spot = new THREE.SpotLight(0xffe8c8, 22, 0, 1.25, 1, 1.4); spot.position.set(0, H - 0.95, 0); spot.target.position.set(0, 0, 0);
  spot.castShadow = true; spot.shadow.mapSize.set(1024, 1024); spot.shadow.radius = 6; spot.shadow.bias = -0.0005;
  scene.add(spot, spot.target);
}
renderer.render(scene, cam);
document.title = 'ready';
if (q.get('walk')) {
  const keys = {}; let drag = null;
  addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyR') cam.position.set(0, EYE, 0); });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointermove', (e) => { if (!drag) return;
    cam.rotation.y += (e.clientX - drag[0]) * 0.004; cam.rotation.x = Math.max(-1.5, Math.min(1.5, cam.rotation.x + (e.clientY - drag[1]) * 0.004));
    drag = [e.clientX, e.clientY]; });
  const f = new THREE.Vector3(), r = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    cam.getWorldDirection(f); f.y = 0; f.normalize(); r.crossVectors(f, cam.up);
    const v = 0.03;
    if (keys.KeyW) cam.position.addScaledVector(f, v); if (keys.KeyS) cam.position.addScaledVector(f, -v);
    if (keys.KeyD) cam.position.addScaledVector(r, v); if (keys.KeyA) cam.position.addScaledVector(r, -v);
    const d = Math.hypot(cam.position.x, cam.position.z), max = R - 0.3;  // stay inside the round wall
    if (d > max) { cam.position.x *= max / d; cam.position.z *= max / d; }
    renderer.render(scene, cam);
  });
}
</script></body></html>
